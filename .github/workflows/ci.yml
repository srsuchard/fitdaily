name: CI

# Quality gate: lint, typecheck, and run the test suite on every pull request
# and on pushes to the main lines. Keeps broken code from merging.

on:
  push:
    branches: [main, scaffold/fitdaily-mvp]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the dev environment (the lockfile is generated by npm 11 /
          # Node 24); @testing-library/react-native also requires Node >= 24.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
